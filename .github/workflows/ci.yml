# 代码检查：管道单元测试 + 网站类型检查与构建。
# （用存档快照离线重算数据集的可复现性检查在 data-refresh 里、数据存档之后进行。）
name: ci

on:
  push:
    paths-ignore:
      - "data/**"
      - "web/public/data/**"
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "pipeline[test]"
      - run: python -m pytest pipeline -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
