# 抓取官方数据 → 校验 → 生成网站数据集，并把原始快照与结果提交回当前分支。
# 触发：管道代码变更时自动运行；默认分支上每天定时运行；
# 也可在 GitHub 仓库的 Actions 页面选择 “data-refresh” 后点击 “Run workflow” 手动刷新。
name: data-refresh

on:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/data.yml"
  schedule:
    - cron: "23 7 * * *" # 每天 07:23 UTC（北京时间 15:23）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: pip install -e "pipeline[test]"
      - name: Unit tests
        run: python -m pytest pipeline -q
      - name: Fetch, validate and build
        id: build
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          set +e
          python -m wagegold
          echo "code=$?" >> "$GITHUB_OUTPUT"
      # 可复现性：只用刚存档的快照离线重算一遍，结果必须与联网生成的数据集一致（生成时间除外）。
      - name: Reproduce the dataset offline from the archived snapshots
        id: repro
        if: steps.build.outputs.code == '0'
        run: |
          cp web/public/data/dataset.json /tmp/online.json
          python -m wagegold --offline
          python - <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in ("/tmp/online.json", "web/public/data/dataset.json"))
          for d in (a, b):
              d.pop("generated_at", None)
          if a != b:
              diff = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
              print(f"::error::离线重算结果与联网生成的数据集不一致：{diff}")
              sys.exit(1)
          print("离线重算结果一致")
          PY
          cp /tmp/online.json web/public/data/dataset.json
      # 原始快照与校验报告总是提交（便于审计和排查）；网站数据集只有全部校验通过才会更新。
      - name: Commit snapshots, check report and (if valid) dataset
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if [ -d web/public/data ]; then git add -A web/public/data; fi
          if git diff --cached --quiet; then
            echo "数据无变化"
            exit 0
          fi
          git commit -m "data: 刷新官方数据快照 $(date -u +%Y-%m-%dT%H:%MZ)（管道退出码 ${{ steps.build.outputs.code }}）"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Fail when a source or a check failed
        if: steps.build.outputs.code != '0'
        run: |
          echo "::error::管道退出码 ${{ steps.build.outputs.code }}：必需来源失败(1)、交叉校验失败(2)或构建异常(3)，网站数据集未更新。详见 data/checks.json"
          exit 1
      - name: Fail when the offline rebuild differs
        if: steps.repro.outcome == 'failure'
        run: exit 1
